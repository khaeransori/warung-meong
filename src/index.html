<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff8c42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Warung Meong — game masak 3D untuk anak. Jadi kucing koki dan layani pelanggan!">
<title>Warung Meong</title>
<!--HEAD-->
<style>/*FONT*/
/*CSS*/</style>
</head>
<body class="sky-title">
<canvas id="c"></canvas>
<div id="world-ui"></div>
<div id="touch" class="hidden"></div>
<div id="joy-base"><div id="joy-knob"></div></div>
<div id="hud" class="hidden">
  <div id="hud-tl"><div class="pill coin" id="coin-pill"><i class="coin-ic"></i><span id="coin-num">0</span></div><div class="pill day" id="day-pill">Hari 1</div><div id="hud-tc"><div class="clock" id="clock"><div class="sun"></div><span id="clock-t">0:00</span></div><div class="starbar" id="starbar"></div></div></div>
  <div id="hud-tr"><button class="rbtn" id="btn-pause" aria-label="Menu"></button></div>
  <div id="coach" class="hide"></div>
  <div id="carry" class="hidden"></div>
  <button id="act-btn"><div id="act-ic" class="paw"></div><span id="act-label">Meong!</span></button>
</div>
<div id="screens"><div class="screen" id="loading"><svg class="paw" viewBox="0 0 24 24" fill="#ff8c42"><ellipse cx="12" cy="15.5" rx="5" ry="4.4"/><circle cx="5.8" cy="10.3" r="2.3"/><circle cx="18.2" cy="10.3" r="2.3"/><circle cx="9" cy="5.8" r="2.2"/><circle cx="15" cy="5.8" r="2.2"/></svg><div class="lt">Memuat Warung Meong...</div></div></div>
<div id="fade"></div>
<div id="banner"></div>
<div id="toast"></div>
<script>/*JS*/</script>
<!--TAIL-->
</body>
</html>
